<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입시 근거 상담실</title>
<style>
:root{--ink:#202823;--muted:#63706a;--line:#dce3dd;--paper:#fafcf9;--green:#175d45;--mint:#e8f2eb;--red:#a14331;--rose:#fbede7;--blue:#2c6681;--white:#fff}*{box-sizing:border-box;letter-spacing:0}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.65 'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);background:white;padding:8px 14px;border-radius:5px;color:var(--ink)}button:disabled{opacity:.55;cursor:wait}button:hover:not(:disabled){border-color:var(--green)}a{color:var(--green)}header{min-height:76px;padding:15px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);background:white}h1{font-size:22px;margin:0;font-weight:700}h2{font-size:17px;margin:0 0 16px}h3{font-size:15px;margin:0 0 8px}.brand{display:flex;align-items:center;gap:15px}.mark{display:grid;place-items:center;width:35px;height:35px;background:var(--green);color:white;font:24px Georgia,serif}.eyebrow{font-size:10px;font-weight:700;color:var(--muted)}.header-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.badge{font-size:12px;border-radius:4px;background:var(--mint);color:var(--green);padding:4px 8px;white-space:nowrap}.badge.warn{background:var(--rose);color:var(--red)}.layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 76px)}aside.filters{border-right:1px solid var(--line);padding:27px 22px;background:linear-gradient(180deg,#f1f5f0, #fafcf9 65%)}label.field{display:block;font-size:13px;font-weight:600;margin-bottom:19px}select,input{display:block;width:100%;border:1px solid #cbd6ce;background:white;padding:9px 10px;border-radius:4px;color:var(--ink);min-height:42px}select{margin-top:6px}input[type=checkbox]{display:inline-block;width:17px;min-height:17px;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--green)}.check{font-size:13px;display:block}.scope-note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:24px;padding-top:18px}.source-graph{display:block;width:100%;height:130px;margin-top:20px}.source-graph text{font-family:'Apple SD Gothic Neo',sans-serif}.data-counts{font-size:12px;display:flex;justify-content:space-between;color:var(--muted)}main{padding:28px 30px;min-width:0;max-width:1450px;width:100%;margin:0 auto}.workspace-heading{display:flex;justify-content:space-between;align-items:baseline;gap:15px;margin-bottom:18px}.workspace-heading h2{font-size:24px;margin:0}.small{font-size:12px;color:var(--muted)}.notice{border-left:3px solid #b66a39;background:#f9f0e8;padding:10px 13px;font-size:13px;margin-bottom:22px}.composer{border:1px solid #b8cbbf;border-radius:6px;background:white;overflow:hidden}.composer:focus-within{outline:2px solid #aecbbb}textarea{width:100%;min-height:98px;resize:vertical;padding:16px;border:0;background:transparent;outline:none;display:block;color:var(--ink)}.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:10px 14px;border-top:1px solid #eef1ed}.primary{background:var(--green);color:white;border-color:var(--green)}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0 27px}.examples button{font-size:12px;padding:5px 10px;background:transparent}.results{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.85fr);gap:28px;border-top:1px solid var(--line);padding-top:23px}.answer{min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}.section-head h2{margin:0}.empty{color:#7e8881;font-size:14px;padding:36px 0}.answer-point{margin-bottom:19px;padding-bottom:18px;border-bottom:1px solid #e8ede8;animation:appear .25s ease-out}.answer-point p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}.citation{font-size:11px;padding:1px 7px;margin-right:5px;color:var(--blue);background:#eff5f7;border:1px solid #d4e2e9;border-radius:3px}.missing{margin-top:18px;padding-left:16px;border-left:2px solid #d5b199;color:#765644;font-size:13px}.missing p{margin:6px 0}.evidence-panel{border-left:1px solid var(--line);padding-left:23px;min-width:0}.source{border-bottom:1px solid var(--line);padding:0 0 15px;margin-bottom:15px;scroll-margin-top:20px}.source summary{cursor:pointer;font-size:13px;font-weight:600;overflow-wrap:anywhere;list-style:none}.source summary::before{content:'+';font-family:monospace;color:var(--green);margin-right:8px}.source[open] summary::before{content:'−'}.source-id{font-size:11px;color:var(--blue);margin-right:7px}.source pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 'Apple SD Gothic Neo',sans-serif;max-height:320px;overflow:auto;background:#f1f5f1;padding:12px;margin:10px 0}.source .meta{font-size:11px;color:var(--muted);margin-top:5px}.source a{font-size:12px}.trace{margin-top:27px;border-top:1px solid var(--line);padding-top:15px}.trace summary{cursor:pointer;font-size:13px;color:var(--muted)}.trace-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;border-bottom:1px solid #e9eee9;padding:10px 0;font-size:12px;overflow-wrap:anywhere}.trace-row strong{font-weight:600}.graph-path{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;margin-bottom:9px;color:var(--blue)}.graph-path span{border-bottom:1px solid #bed1d8}.error{color:var(--red);font-size:13px}.hidden{display:none!important}dialog{border:1px solid var(--line);border-radius:8px;max-width:440px;width:calc(100% - 32px);padding:25px;box-shadow:0 14px 50px #14241a20}dialog::backdrop{background:#1a292645}dialog input{margin:5px 0 15px}.dialog-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}.connection-state{font-size:12px;color:var(--muted);margin-bottom:20px}.loading-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;animation:pulse 1s infinite}.status-text{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.error:empty{display:none}@keyframes pulse{50%{opacity:.25}}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:1180px){.layout{grid-template-columns:210px minmax(0,1fr)}main{padding:24px}.results{grid-template-columns:1fr}.evidence-panel{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:20px}}@media(max-width:650px){header{padding:13px 16px;align-items:flex-start}.brand{gap:9px}h1{font-size:18px}.eyebrow{font-size:9px}.header-actions{gap:5px;justify-content:flex-end;max-width:140px}.header-actions button{font-size:11px;padding:5px 7px}.badge{font-size:10px}.layout{display:block}aside.filters{padding:16px;border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px}.filters h2,.source-graph,.data-counts,.scope-note{display:none}.filters label.field{margin:0}.filters .model-field{grid-column:1/-1}.filters .check{grid-column:1/-1}.filters #new-question{grid-column:1/-1}main{padding:20px 16px}.workspace-heading h2{font-size:20px}.workspace-heading .small{max-width:115px;text-align:right}.notice{font-size:12px}.examples{gap:6px}.results{gap:22px}.trace-row{grid-template-columns:105px minmax(0,1fr)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">A</span><div><div class="eyebrow">ADMISSIONS / 2027 · 2028</div><h1>입시 근거 상담실</h1></div></div><div class="header-actions"><span id="model-state" class="badge">모델 확인 중</span><span id="connection" class="badge warn" role="status">Neo4j 상태 확인 중</span></div></header>
<div class="layout"><aside class="filters"><h2>검색 범위</h2><label class="field">지원 학년도<select id="year"><option>2028</option><option>2027</option></select></label><label class="field">대학<select id="university"><option value="">전체 대학</option></select></label><label class="field model-field">로컬 모델<select id="model" aria-label="로컬 모델"></select></label><label class="check"><input type="checkbox" id="include-history">2026 입결 함께 조회</label><div class="scope-note">수시 · 학생부교과 · 학생부종합<br>입결의 9등급제와 5등급제 직접 비교 제외</div><svg class="source-graph" viewBox="0 0 190 130" role="img" aria-label="대학에서 문서, 문서에서 페이지 근거로 연결된 공용 자료 구조"><path d="M34 35 L94 67 L155 99" stroke="#a5bfb0" stroke-width="2" fill="none"/><circle cx="34" cy="35" r="12" fill="#175d45"/><circle cx="94" cy="67" r="10" fill="#2c6681"/><circle cx="155" cy="99" r="8" fill="#b76e54"/><text x="51" y="29" font-size="12" fill="#175d45">대학</text><text x="109" y="62" font-size="12" fill="#2c6681">문서</text><text x="103" y="124" font-size="12" fill="#8b533f">페이지 근거</text></svg><div class="data-counts"><span id="doc-count">문서 17개</span><span id="fragment-count">근거 505개</span></div></aside>
<main><div class="workspace-heading"><h2>자료 기반 질의</h2><span class="small">로컬 처리 · 대화 저장 안 함</span></div><div class="notice" role="note">미검토 원문 기반 답변입니다. 지원자격·합격 가능성의 확정 판정은 제공하지 않습니다.</div><form id="ask-form"><div class="composer"><textarea id="question" aria-label="상담 질문" placeholder="대학, 모집단위와 궁금한 항목을 입력하세요" maxlength="2000" required></textarea><div class="composer-bottom"><span id="progress" class="status-text" aria-live="polite">학년도와 대학 범위를 확인하세요</span><button class="primary" id="submit" type="submit">질문 보내기</button></div></div></form><div class="examples"><button type="button" data-question="연세대 2028학년도 컴퓨터 분야 권장과목과 수학 과목을 알려줘">연세대 권장과목</button><button type="button" data-question="서울대 2027학년도 학생부종합전형의 서류 평가관점을 설명해줘" data-year="2027">서울대 서류 평가</button><button type="button" data-question="부산대 간호학과의 2026 입결 지표와 해석할 때 주의점을 알려줘" data-history="true">부산대 간호학과 입결</button><button type="button" id="clear">새 질문</button></div><p id="error" class="error" role="alert"></p>
<div class="results"><section class="answer"><div class="section-head"><h2>상담 답변</h2><span id="answer-model" class="small"></span></div><div id="answer" aria-live="polite"><div class="empty">아직 작성된 답변이 없습니다.</div></div><div id="missing" class="missing hidden"></div><details class="trace hidden" id="trace"><summary>검색 실행 내역</summary><div id="trace-items"></div><div id="paths"></div></details></section><section class="evidence-panel"><div class="section-head"><h2>검색 근거</h2><span id="evidence-count" class="small">0개</span></div><div id="evidence"><div class="empty">검색된 원문과 지표가 여기에 표시됩니다.</div></div></section></div></main></div>
<script>
const element = id => document.getElementById(id);
let csrf = '', busy = false;
function node(tag, text, className){const result=document.createElement(tag);if(text!==undefined)result.textContent=text;if(className)result.className=className;return result}
async function api(route, data){const response=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Session-Key':csrf},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error||'요청에 실패했습니다.');return result}
async function status(){
	const response=await fetch('/api/status');
	const state=await response.json();
	csrf=state.csrf;
	const previous=element('model').value;
	element('model').replaceChildren();
	state.models.forEach(name=>{const option=node('option',name);option.value=name;element('model').append(option)});
	element('model').value=state.models.includes(previous)?previous:state.models.includes('gpt-oss:20b')?'gpt-oss:20b':state.models[0]||'';
	element('model-state').textContent=state.models.length?'Ollama 연결됨':'Ollama 미연결';
	element('model-state').className='badge'+(state.models.length?'':' warn');
	element('connection').textContent=state.graph_connected?'Neo4j 공용 연결됨':'Neo4j 공용 미설정';
	element('connection').className='badge'+(state.graph_connected?'':' warn');
	if(element('university').options.length===1)Object.entries(state.universities).forEach(([key,value])=>{const option=node('option',value);option.value=key;element('university').append(option)});
	element('doc-count').textContent=`문서 ${state.counts.documents}개`;
	element('fragment-count').textContent=`근거 ${state.counts.fragments}개`;
}
function render(result){element('answer').replaceChildren();element('evidence').replaceChildren();element('paths').replaceChildren();element('trace-items').replaceChildren();element('answer-model').textContent=result.model;element('evidence-count').textContent=`${result.evidence.length}개`;result.points.forEach(point=>{const item=node('article',undefined,'answer-point');item.append(node('p',point.text));point.sources.forEach(id=>{const citation=node('button',id,'citation');citation.type='button';citation.title=`${id} 근거 보기`;citation.onclick=()=>{const target=element('source-'+id);target.open=true;target.scrollIntoView({behavior:'smooth',block:'center'})};item.append(citation)});element('answer').append(item)});if(!result.points.length)element('answer').append(node('div','확인 가능한 근거를 먼저 살펴보세요.','empty'));element('missing').replaceChildren(node('h3','추가 확인'));result.unsupported.forEach(text=>element('missing').append(node('p',text)));element('missing').classList.toggle('hidden',!result.unsupported.length);result.evidence.forEach(source=>{const card=node('details',undefined,'source');card.id='source-'+source.id;const summary=node('summary');summary.append(node('span',source.id,'source-id'));summary.append(document.createTextNode(source.kind==='document'?source.title:`${source.university} · ${source.unit} · ${source.metric}`));card.append(summary);if(source.kind==='document'){card.append(node('div',`PDF ${source.page}페이지 · 미검토 원문`,'meta'));card.append(node('pre',source.text));const link=node('a','원문 PDF 열기');link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';card.append(link)}else{card.append(node('div',`${source.year}학년도 · ${source.track} · ${source.admission_type}`,'meta'));const fields=[['지표',source.metric_group+' / '+source.metric],['값',source.value===null?'원문에 수치 없음':source.original_value+' '+source.unit_of_measure],['집계대상',source.population],['산출기준',source.calculation_basis],['주의사항',source.cautions],['주석',source.notes],['비고',source.remarks],['출처',source.source_file+' / '+source.page+'페이지']];card.append(node('pre',fields.map(([key,value])=>key+': '+(value||'미기재')).join('\n')))}element('evidence').append(card)});if(!result.evidence.length)element('evidence').append(node('div','선택한 범위에서 검색된 근거가 없습니다.','empty'));result.trace.forEach(step=>{const row=node('div',undefined,'trace-row');row.append(node('strong',step.tool));const description=node('div',step.status);description.append(node('div',step.detail,'small'));row.append(description);element('trace-items').append(row)});if(result.paths.length){element('paths').append(node('h3','확인된 그래프 경로'));result.paths.forEach(path=>{const row=node('div',undefined,'graph-path');row.append(node('span',path.university),node('b','→'),node('span',path.document),node('b','←'),node('span',`PDF ${path.page}페이지`));element('paths').append(row)})}element('trace').classList.remove('hidden')}
element('ask-form').onsubmit=async event=>{event.preventDefault();if(busy)return;busy=true;element('error').textContent='';element('submit').disabled=true;element('clear').disabled=true;const started=Date.now();const update=()=>{element('progress').replaceChildren(node('span',undefined,'loading-dot'),document.createTextNode(`검색·답변 생성 중 ${Math.floor((Date.now()-started)/1000)}초`))};update();const timer=setInterval(update,1000);try{const result=await api('/api/ask',{question:element('question').value,year:Number(element('year').value),university:element('university').value,model:element('model').value,include_history:element('include-history').checked});render(result);element('progress').textContent=`완료 · ${Math.round((Date.now()-started)/1000)}초`}catch(error){element('error').textContent=error.message;element('progress').textContent='요청을 완료하지 못했습니다.'}finally{clearInterval(timer);busy=false;element('submit').disabled=false;element('clear').disabled=false}};
document.querySelectorAll('[data-question]').forEach(button=>button.onclick=()=>{if(busy)return;element('question').value=button.dataset.question;element('year').value=button.dataset.year||'2028';element('university').value='';element('include-history').checked=button.dataset.history==='true';element('question').focus()});
element('clear').onclick=()=>{if(busy)return;element('question').value='';element('answer').replaceChildren(node('div','아직 작성된 답변이 없습니다.','empty'));element('evidence').replaceChildren(node('div','검색된 원문과 지표가 여기에 표시됩니다.','empty'));element('evidence-count').textContent='0개';element('answer-model').textContent='';element('missing').classList.add('hidden');element('trace').classList.add('hidden');element('error').textContent='';element('progress').textContent='새 질문';element('question').focus()};
status().catch(()=>{element('model-state').textContent='연결 확인 필요';element('error').textContent='로컬 서버 상태를 확인하지 못했습니다.'});
</script>
</body></html>
